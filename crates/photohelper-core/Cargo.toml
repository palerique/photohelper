[package]
name = "photohelper-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "photohelper domain model, error types, and catalog-glue boundary"

[lints]
workspace = true

[dependencies]
# R2-T26: kamadak-exif + tracing removed — neither was used in this crate
# (verified by Grep), and pulling encoding-format-specific parsers into the
# domain model crate breaks the "core → ⊥" invariant the crate-DAG strength
# note relies on. `kamadak-exif` lives in `photohelper-cli` where EXIF is
# actually parsed; `tracing` is for the binary/CLI layer.
blake3.workspace = true
base64.workspace = true
thiserror.workspace = true
static_assertions.workspace = true
# `time` crate dropped in session 02 D4 (unused — the only `time::`
# references in this crate are `std::time::UNIX_EPOCH`, not the `time`
# crate); the new `unused_crate_dependencies` workspace lint caught it.

[dev-dependencies]
tempfile.workspace = true
# `trybuild` removed in session 02 (Deliverable 4 atomic commit per
# plan §4a item 7a + R3-T4 coordination): the dep was declared but
# never consumed, and the new `unused_crate_dependencies` lint would
# fire. The DN-008 row-6 compile-fail test will re-declare it in the
# same commit that adds the test (deferred to session 03+).
filetime.workspace = true
