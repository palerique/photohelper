[package]
name = "photohelper-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Resize, watermark, and JPEG encode (mozjpeg + cosmic-text + tiny-skia)"

[lints.rust]
unsafe_code = "allow" # Explicit override for MozJPEG FFI bindings

[dependencies]
photohelper-core = { path = "../photohelper-core" }
photohelper-catalog = { path = "../photohelper-catalog" }
photohelper-raw = { path = "../photohelper-raw" }
tiny-skia.workspace = true
cosmic-text.workspace = true
mozjpeg.workspace = true
tracing.workspace = true
thiserror.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tempfile.workspace = true
