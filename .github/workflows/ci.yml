# photohelper — CI.
#
# Mirrors `just ci`. The protocol job (verify-state) is stack-agnostic; the
# gate jobs (fmt, lint, test, audit) use the Rust step blocks from
# stacks/rust.md. Green locally (`just ci`) == green here.
#
# Security note: action versions below use the `@vN` floating tags for
# bootstrap readability; replace each with a commit SHA per your
# supply-chain policy before relying on this for releases.
# (search for `<<pin to SHA>>` in stacks/rust.md for the policy reminder.)

name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Stack-agnostic protocol gate -----------------------------------------
  verify-state:
    name: verify-state (scaffolding intact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # <<pin to SHA>>
      - name: Verify repo state
        run: ./scripts/verify-state.sh

  # --- Rust quality gates (bodies sourced from stacks/rust.md) -------------
  fmt:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # <<pin to SHA>>
      - uses: dtolnay/rust-toolchain@stable   # <<pin to SHA>>
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  lint:
    name: lint (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # <<pin to SHA>>
      - uses: dtolnay/rust-toolchain@stable   # <<pin to SHA>>
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2   # <<pin to SHA>>
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # <<pin to SHA>>
      - uses: dtolnay/rust-toolchain@stable   # <<pin to SHA>>
      - uses: Swatinem/rust-cache@v2   # <<pin to SHA>>
      - run: cargo test --all-features --workspace --no-fail-fast

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # <<pin to SHA>>
      - uses: dtolnay/rust-toolchain@stable   # <<pin to SHA>>
      - uses: Swatinem/rust-cache@v2   # <<pin to SHA>>
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
