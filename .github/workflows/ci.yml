# photohelper — CI.
#
# Mirrors `just ci`. The protocol job (verify-state) is stack-agnostic; the
# gate jobs (fmt, lint, test, audit, sanitize-check) use the Rust step blocks
# from stacks/rust.md. Green locally (`just ci`) == green here.
#
# Action versions pinned to commit SHAs (TD-001, session 06):
#   actions/checkout       v4.3.1  34e114876b0b11c390a56381ad16ebd13914f8d5
#   dtolnay/rust-toolchain HEAD    3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
#   Swatinem/rust-cache    v2.9.1  c19371144df3bb44fab255c43d04cbc2ab54d1c4
# Upgrade cadence: annually or when a CVE forces an earlier upgrade.
# See docs/decisions/0004-action-version-pinning.md.
#
# System prerequisites for the LibRaw build:
#   * pkg-config + autoconf + libtool + make + g++ (apt build-essential)
# Installed in the lint + test jobs via the shared `apt install` step
# below. macOS dev builds get the same via `brew install pkgconf` per
# the README quickstart.

name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Stack-agnostic protocol gate -----------------------------------------
  verify-state:
    name: verify-state (scaffolding intact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Verify repo state
        run: ./scripts/verify-state.sh

  # --- Rust quality gates (bodies sourced from stacks/rust.md) -------------
  fmt:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  lint:
    name: lint (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true
      - name: Install LibRaw build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config autoconf libtool ripgrep
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with: { components: clippy }
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - name: unsafe-isolation gate
        run: ./scripts/check-unsafe-isolation.sh

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true
      - name: Install LibRaw build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config autoconf libtool libimage-exiftool-perl
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - run: cargo test --all-features --workspace --no-fail-fast
      - name: sanitize-check (CR3 fixtures)
        run: ./scripts/sanitize-check.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
