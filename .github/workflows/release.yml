# photohelper — Release pipeline.
#
# Triggered by a `v*.*.*` git tag (e.g. `git tag v0.1.0 && git push --tags`).
#
# ORT runtime architecture (ort 2.0.0-rc.12):
#
#   macOS arm64  — ORT inference runs through Apple's CoreML.framework (system,
#                  always present). Binary has NO external ORT dependency.
#                  CoreML shows up in `otool -L`; no libonnxruntime.dylib needed.
#
#   Linux x86_64 — ort-sys links libonnxruntime.a (ORT 1.24.2 static archive
#                  cached in ~/.cache/ort.pyke.io/). Binary is self-contained;
#                  no libonnxruntime.so to bundle.
#
#   Windows      — ort-sys has no x86_64-pc-windows-gnu prebuilt on pyke CDN.
#                  Windows support deferred to v0.2 (TD-029).
#
# Each archive contains only: binary + models + README-install.md.
# PHOTOHELPER_MODEL_DIR env var must point to the models/ directory at runtime.
#
# Action versions pinned to commit SHAs (TD-001 policy):
#   actions/checkout           v4.3.1   34e114876b0b11c390a56381ad16ebd13914f8d5
#   dtolnay/rust-toolchain     HEAD     3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
#   Swatinem/rust-cache        v2.9.1   c19371144df3bb44fab255c43d04cbc2ab54d1c4
#   actions/upload-artifact    HEAD     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact  HEAD     484a0b528fb4d7bd804637ccb632e47a0e638317
#   softprops/action-gh-release HEAD    3efcac8951299998593f871640ea8059d6818655

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  RUST_TOOLCHAIN: '1.88.0'
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  # ORT inference runs through Apple CoreML.framework — no separate ORT library.
  # Intel Mac users: run arm64 binary via Rosetta 2 (transparent).
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-macos-arm64-v4

      - name: Install LibRaw build dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          cp "target/${TARGET}/release/photohelper" "${DIR}/"
          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-macos.md "${DIR}/README-install.md"

          tar czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Archive size: $(du -sh ${DIR}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: macos-arm64
          path: photohelper-*.tar.gz*

  # ── Linux x86_64-gnu ───────────────────────────────────────────────────────
  # ort-sys statically links libonnxruntime.a — binary is self-contained.
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config autoconf libtool \
            libimage-exiftool-perl

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-linux-x86_64-v4

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          cp "target/${TARGET}/release/photohelper" "${DIR}/"
          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-linux.md "${DIR}/README-install.md"

          tar czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Archive size: $(du -sh ${DIR}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: linux-x86_64
          path: photohelper-*.tar.gz*

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release (draft)
    needs: [build-macos-arm64, build-linux-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317  # HEAD
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@3efcac8951299998593f871640ea8059d6818655  # HEAD
        with:
          files: dist/**
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
