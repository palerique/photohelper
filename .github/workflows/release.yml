# photohelper — Release pipeline.
#
# Triggered by a `v*.*.*` git tag (e.g. `git tag v0.1.0 && git push --tags`).
# Builds release archives for macOS arm64, Linux x86_64-gnu, and Windows x86_64.
#
# ORT prebuilt availability (ort-sys 2.0.0-rc.12 / ORT 1.24.2):
#   aarch64-apple-darwin      ✓ pyke CDN — macOS Apple Silicon
#   x86_64-unknown-linux-gnu  ✓ pyke CDN — Linux glibc
#   x86_64-pc-windows-msvc    ✓ pyke CDN — Windows (requires MSVC build of LibRaw via cmake)
#   x86_64-apple-darwin       ✗ no prebuilt — Intel Mac users run arm64 via Rosetta 2
#   x86_64-pc-windows-gnu     ✗ no prebuilt — would require manual ORT download
#
# The copy-dylibs ort feature ensures the ORT shared library is copied to
# target/{target}/release/ alongside the binary during cargo build.
#
# Archive contents:
#   photohelper / photohelper.exe  (binary, rpath-patched on Unix)
#   libonnxruntime.dylib / .so / onnxruntime.dll  (ORT runtime, ~60 MB)
#   models/                        (NIMA 12 MB + CLIP 85 MB — bundled for zero-config)
#   README-install.md
#
# Action versions pinned to commit SHAs (TD-001 policy):
#   actions/checkout           v4.3.1   34e114876b0b11c390a56381ad16ebd13914f8d5
#   dtolnay/rust-toolchain     HEAD     3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
#   Swatinem/rust-cache        v2.9.1   c19371144df3bb44fab255c43d04cbc2ab54d1c4
#   actions/upload-artifact    HEAD     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact  HEAD     484a0b528fb4d7bd804637ccb632e47a0e638317
#   softprops/action-gh-release HEAD    3efcac8951299998593f871640ea8059d6818655
#   msys2/setup-msys2          v2.31.1  e9898307ac31d1a803454791be09ab9973336e1c

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  RUST_TOOLCHAIN: '1.88.0'
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  # Intel Mac users: run the arm64 binary via Rosetta 2 (transparent, no config needed).
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-macos-arm64

      - name: Install LibRaw build dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Build release binary
        # copy-dylibs feature ensures libonnxruntime.dylib lands in target/{target}/release/
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          BINARY="target/${TARGET}/release/photohelper"
          mkdir -p "${DIR}/models"

          cp "${BINARY}" "${DIR}/"

          # copy-dylibs puts a symlink in target/{target}/release/ — resolve to real file.
          ORT_LINK="target/${TARGET}/release/libonnxruntime.dylib"
          if [[ -e "${ORT_LINK}" ]]; then
              ORT_REAL=$(readlink -f "${ORT_LINK}" 2>/dev/null || echo "${ORT_LINK}")
          else
              ORT_REAL=$(find . -name 'libonnxruntime.dylib' 2>/dev/null | grep -v proc_macro | head -1 || true)
          fi
          if [[ -z "${ORT_REAL}" || ! -e "${ORT_REAL}" ]]; then
              echo "ERROR: libonnxruntime.dylib not found" >&2
              echo "=== otool -L output ===" >&2
              otool -L "${BINARY}" >&2 || true
              echo "=== all .dylib files ===" >&2
              find . -name '*.dylib' 2>/dev/null | grep -v proc_macro | head -30 >&2
              exit 1
          fi
          echo "Found ORT library: ${ORT_REAL}"
          cp "${ORT_REAL}" "${DIR}/libonnxruntime.dylib"

          # Patch: change embedded ORT path to @loader_path so it finds the bundled lib.
          EMBEDDED=$(otool -L "${DIR}/photohelper" | grep -i onnxruntime | awk '{print $1}' | head -1 || true)
          if [[ -n "${EMBEDDED}" ]]; then
              install_name_tool -change "${EMBEDDED}" "@loader_path/libonnxruntime.dylib" "${DIR}/photohelper"
              echo "Patched: ${EMBEDDED} -> @loader_path/libonnxruntime.dylib"
          else
              install_name_tool -add_rpath @loader_path "${DIR}/photohelper"
          fi

          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-macos.md "${DIR}/README-install.md"

          tar czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Archive size: $(du -sh ${DIR}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: macos-arm64
          path: photohelper-*.tar.gz*

  # ── Linux x86_64-gnu ───────────────────────────────────────────────────────
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config autoconf libtool \
            patchelf libimage-exiftool-perl

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-linux-x86_64

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          BINARY="target/${TARGET}/release/photohelper"
          mkdir -p "${DIR}/models"

          cp "${BINARY}" "${DIR}/"

          # copy-dylibs feature puts a symlink in target/{target}/release/
          ORT_LINK="target/${TARGET}/release/libonnxruntime.so"
          if [[ -e "${ORT_LINK}" ]]; then
              ORT_REAL=$(readlink -f "${ORT_LINK}" 2>/dev/null || echo "${ORT_LINK}")
          else
              ORT_REAL=$(find . -name 'libonnxruntime.so' 2>/dev/null | grep -v proc_macro | head -1 || true)
          fi
          if [[ -z "${ORT_REAL}" || ! -e "${ORT_REAL}" ]]; then
              echo "ERROR: libonnxruntime.so not found" >&2
              echo "=== ldd output ===" >&2
              ldd "${BINARY}" >&2 || true
              echo "=== all .so files ===" >&2
              find . -name 'libonnxruntime*.so*' 2>/dev/null | head -30 >&2
              exit 1
          fi
          echo "Found ORT library: ${ORT_REAL}"
          cp "${ORT_REAL}" "${DIR}/libonnxruntime.so"

          # Also copy versioned variants that may be referenced by SONAME
          ORT_DIR=$(dirname "${ORT_REAL}")
          find "${ORT_DIR}" -name 'libonnxruntime.so*' -exec cp -n {} "${DIR}/" \; 2>/dev/null || true

          # Patch rpath to $ORIGIN so binary finds the bundled library
          patchelf --set-rpath '$ORIGIN' "${DIR}/photohelper"

          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-linux.md "${DIR}/README-install.md"

          tar czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Archive size: $(du -sh ${DIR}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: linux-x86_64
          path: photohelper-*.tar.gz*

  # ── Windows x86_64-gnu ─────────────────────────────────────────────────────
  # Uses MSYS2 MINGW64 for LibRaw (sh ./configure + make) and the Windows MSVC
  # ORT prebuilt (C-ABI compatible with MinGW binary; only C types cross the DLL
  # boundary via ORT's onnxruntime_c_api.h). ORT_LIB_DIR bypasses ort-sys download
  # and uses our manually extracted MSVC prebuilt.
  build-windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          (Get-Content Cargo.toml) -replace '^version = "0\.0\.0"', "version = `"$version`"" | Set-Content Cargo.toml
          Add-Content $env:GITHUB_ENV "RELEASE_VERSION=$version"

      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c  # v2.31.1
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-zlib
            zip

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-windows-x86_64

      - name: Download ORT Windows MSVC prebuilt (C-ABI compatible with MinGW binary)
        run: |
          # ORT 1.24.2 MSVC prebuilt — works with MinGW binary via C API (no C++ ABI boundary)
          mkdir -p ort-win-tmp ort-win
          URL="https://cdn.pyke.io/0/pyke:ort-rs/ms@1.24.2/x86_64-pc-windows-msvc.tar.lzma2"
          echo "Downloading ORT: ${URL}"
          curl -L "${URL}" -o ort-win-tmp/ort.tar.lzma2
          # Extract lzma2 archive using 7z (available on windows-latest runners)
          cd ort-win-tmp && 7z x ort.tar.lzma2 -y
          7z x "$(ls *.tar)" -o../ort-win -y
          echo "ORT contents:"
          find ../ort-win -type f | head -20

      - name: Build release binary
        shell: msys2 {0}
        env:
          # ORT_LIB_DIR tells ort-sys to use our prebuilt instead of downloading
          ORT_LIB_DIR: ${{ github.workspace }}/ort-win/lib
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          export PATH="/mingw64/bin:$PATH"
          cargo build --release -p photohelper-cli --target x86_64-pc-windows-gnu

      - name: Bundle archive (.zip)
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="x86_64-pc-windows-gnu"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          cp "target/${TARGET}/release/photohelper.exe" "${DIR}/"

          # Find onnxruntime.dll — either copy-dylibs put it in target/ or use our prebuilt
          ORT_DLL="target/${TARGET}/release/onnxruntime.dll"
          if [[ ! -f "${ORT_DLL}" ]]; then
              ORT_DLL=$(find ort-win -name 'onnxruntime.dll' 2>/dev/null | head -1 || true)
          fi
          if [[ -z "${ORT_DLL}" || ! -f "${ORT_DLL}" ]]; then
              echo "ERROR: onnxruntime.dll not found" >&2
              find . -name 'onnxruntime*.dll' 2>/dev/null | head -20 >&2
              exit 1
          fi
          echo "Using ORT DLL: ${ORT_DLL}"
          cp "${ORT_DLL}" "${DIR}/onnxruntime.dll"

          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-windows.md          "${DIR}/README-install.md"

          # zip is provided by MSYS2 in PATH
          zip -r "${DIR}.zip" "${DIR}"
          sha256sum "${DIR}.zip" > "${DIR}.zip.sha256"
          echo "Archive size: $(du -sh ${DIR}.zip | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: windows-x86_64
          path: photohelper-*.zip*

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release (draft)
    needs: [build-macos-arm64, build-linux-x86_64, build-windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317  # HEAD
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@3efcac8951299998593f871640ea8059d6818655  # HEAD
        with:
          files: dist/**
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
