# photohelper — Release pipeline.
#
# Triggered by a `v*.*.*` git tag (e.g. `git tag v0.1.0 && git push --tags`).
# Builds release archives for macOS arm64, macOS x86_64, and Linux x86_64-gnu.
# Windows x86_64 is deferred to v0.2 (TD-029: LibRaw autoconf / MSVC complexity).
#
# Each archive contains:
#   photohelper              — binary (rpath-patched to find the ORT library)
#   libonnxruntime.{dylib,so} — ONNX Runtime shared library (~60 MB)
#   models/                  — NIMA (12 MB) + CLIP (85 MB) ONNX models
#   README-install.md        — platform-specific install instructions
#
# Action versions pinned to commit SHAs (TD-001 policy):
#   actions/checkout          v4.3.1   34e114876b0b11c390a56381ad16ebd13914f8d5
#   dtolnay/rust-toolchain    HEAD     3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
#   Swatinem/rust-cache       v2.9.1   c19371144df3bb44fab255c43d04cbc2ab54d1c4
#   actions/upload-artifact   HEAD     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact HEAD     484a0b528fb4d7bd804637ccb632e47a0e638317
#   softprops/action-gh-release HEAD   3efcac8951299998593f871640ea8059d6818655

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  RUST_TOOLCHAIN: '1.88.0'
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-macos-arm64

      - name: Install LibRaw build dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          # Binary
          cp "target/${TARGET}/release/photohelper" "${DIR}/"

          # ORT shared library — ort crate downloads to ort-downloaded-libs/ (sibling
          # of target/) when using download-binaries feature. Search the whole workspace.
          echo "Locating libonnxruntime.dylib..."
          ORT_LIB=$(find . -name 'libonnxruntime.dylib' 2>/dev/null | grep -v '.bak' | head -1 || true)
          if [[ -z "${ORT_LIB}" ]]; then
              echo "All .dylib files in workspace:" >&2
              find . -name '*.dylib' 2>/dev/null | head -30
              echo "ERROR: libonnxruntime.dylib not found anywhere in workspace" >&2
              exit 1
          fi
          echo "Found ORT library: ${ORT_LIB}"
          cp "${ORT_LIB}" "${DIR}/"

          # Patch binary rpath so it finds libonnxruntime.dylib in the same directory
          install_name_tool -add_rpath @loader_path "${DIR}/photohelper"

          # Models (Git LFS)
          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"

          # Install guide
          cp scripts/README-install-macos.md "${DIR}/README-install.md"

          # Archive + checksum
          tar czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Archive: $(du -sh ${DIR}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: macos-arm64
          path: photohelper-*.tar.gz*

  # ── macOS x86_64 (Intel) ───────────────────────────────────────────────────
  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-13  # last Intel macOS runner on GHA
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-macos-x86_64

      - name: Install LibRaw build dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          cp "target/${TARGET}/release/photohelper" "${DIR}/"

          echo "Locating libonnxruntime.dylib..."
          ORT_LIB=$(find . -name 'libonnxruntime.dylib' 2>/dev/null | grep -v '.bak' | head -1 || true)
          if [[ -z "${ORT_LIB}" ]]; then
              echo "All .dylib files in workspace:" >&2
              find . -name '*.dylib' 2>/dev/null | head -30
              echo "ERROR: libonnxruntime.dylib not found" >&2
              exit 1
          fi
          echo "Found ORT library: ${ORT_LIB}"
          cp "${ORT_LIB}" "${DIR}/"
          install_name_tool -add_rpath @loader_path "${DIR}/photohelper"

          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-macos.md "${DIR}/README-install.md"

          tar czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: macos-x86_64
          path: photohelper-*.tar.gz*

  # ── Linux x86_64-gnu ───────────────────────────────────────────────────────
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config autoconf libtool \
            patchelf libimage-exiftool-perl

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-linux-x86_64

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          cp "target/${TARGET}/release/photohelper" "${DIR}/"

          # ORT library — ort crate downloads to ort-downloaded-libs/ (workspace root)
          echo "Locating libonnxruntime.so..."
          ORT_LIB=$(find . -name 'libonnxruntime.so' 2>/dev/null | grep -v '.bak' | head -1 || true)
          if [[ -z "${ORT_LIB}" ]]; then
              echo "All .so files matching ort:" >&2
              find . -name 'libonnxruntime*' 2>/dev/null | head -30
              echo "ERROR: libonnxruntime.so not found anywhere in workspace" >&2
              exit 1
          fi
          echo "Found ORT library: ${ORT_LIB}"
          cp "${ORT_LIB}" "${DIR}/"

          # Also copy any versioned variants in the same directory
          ORT_DIR=$(dirname "${ORT_LIB}")
          find "${ORT_DIR}" -name 'libonnxruntime.so*' -exec cp -n {} "${DIR}/" \; || true

          # Patch rpath so binary finds libonnxruntime.so in $ORIGIN (same dir)
          patchelf --set-rpath '$ORIGIN' "${DIR}/photohelper"

          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-linux.md "${DIR}/README-install.md"

          tar czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Archive: $(du -sh ${DIR}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: linux-x86_64
          path: photohelper-*.tar.gz*

  # ── Windows x86_64 ─────────────────────────────────────────────────────────
  # Uses MSYS2 MINGW64 to provide sh, make, autoconf, pkg-config and gcc so
  # the existing `build.rs` (which calls `sh ./configure && make`) works on
  # Windows. The Rust target is x86_64-pc-windows-gnu (MinGW ABI).
  # Archive format: .zip (conventional on Windows). ORT ships onnxruntime.dll
  # which lands next to the .exe — Windows DLL search finds it automatically.
  build-windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-gnu
    defaults:
      run:
        shell: bash  # Git Bash (default on windows-latest)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          (Get-Content Cargo.toml) -replace '^version = "0\.0\.0"', "version = `"$version`"" | Set-Content Cargo.toml
          Add-Content $env:GITHUB_ENV "RELEASE_VERSION=$version"

      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c  # v2.31.1
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-zlib
            zip

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-windows-x86_64

      - name: Build release binary
        # Run inside MSYS2 shell so that sh, make, autoconf, pkg-config,
        # and the MinGW gcc are all on PATH for the LibRaw build.rs.
        shell: msys2 {0}
        env:
          # Tell cargo to use the MinGW GCC linker for x86_64-pc-windows-gnu
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          export PATH="/mingw64/bin:$PATH"
          cargo build --release -p photohelper-cli --target x86_64-pc-windows-gnu

      - name: Bundle archive (.zip)
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="x86_64-pc-windows-gnu"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          cp "target/${TARGET}/release/photohelper.exe" "${DIR}/"

          # Find ORT DLL — ort crate downloads to ort-downloaded-libs/ (workspace root)
          echo "Locating onnxruntime.dll..."
          ORT_DLL=$(find . -name 'onnxruntime.dll' 2>/dev/null | head -1 || true)
          if [[ -z "${ORT_DLL}" ]]; then
              echo "All DLLs matching ort:" >&2
              find . -name 'onnxruntime*.dll' 2>/dev/null | head -30
              echo "ERROR: onnxruntime.dll not found anywhere in workspace" >&2
              exit 1
          fi
          echo "Found ORT DLL: ${ORT_DLL}"
          cp "${ORT_DLL}" "${DIR}/"

          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-windows.md          "${DIR}/README-install.md"

          # Create .zip (MSYS2 provides zip)
          zip -r "${DIR}.zip" "${DIR}"
          sha256sum "${DIR}.zip" > "${DIR}.zip.sha256"
          echo "Archive: $(du -sh ${DIR}.zip | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: windows-x86_64
          path: photohelper-*.zip*

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release (draft)
    needs: [build-macos-arm64, build-macos-x86_64, build-linux-x86_64, build-windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317  # HEAD
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@3efcac8951299998593f871640ea8059d6818655  # HEAD
        with:
          files: dist/**
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
