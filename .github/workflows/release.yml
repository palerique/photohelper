# photohelper — Release pipeline.
#
# Triggered by a `v*.*.*` git tag (e.g. `git tag v0.1.0 && git push --tags`).
#
# ORT runtime architecture (ort 2.0.0-rc.12):
#
#   macOS arm64  — ORT inference runs through Apple's CoreML.framework (system,
#                  always present). Binary has NO external ORT dependency.
#                  CoreML shows up in `otool -L`; no libonnxruntime.dylib needed.
#
#   Linux x86_64 — ort-sys links libonnxruntime.a (ORT 1.24.2 static archive
#                  cached in ~/.cache/ort.pyke.io/). Binary is self-contained;
#                  no libonnxruntime.so to bundle.
#
#   Windows x86_64 — ort-sys statically links libonnxruntime.a (Pyke CDN MSVC
#                    prebuilt, ANL-004). LibRaw via vcpkg x64-windows-static-md.
#                    Binary is self-contained; no onnxruntime.dll to bundle.
#
# Each archive contains only: binary + models + README-install.md.
# PHOTOHELPER_MODEL_DIR env var must point to the models/ directory at runtime.
#
# Action versions pinned to commit SHAs (TD-001 policy):
#   actions/checkout           v4.3.1   34e114876b0b11c390a56381ad16ebd13914f8d5
#   dtolnay/rust-toolchain     HEAD     3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
#   Swatinem/rust-cache        v2.9.1   c19371144df3bb44fab255c43d04cbc2ab54d1c4
#   actions/upload-artifact    HEAD     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact  HEAD     484a0b528fb4d7bd804637ccb632e47a0e638317
#   softprops/action-gh-release HEAD    3efcac8951299998593f871640ea8059d6818655

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:  # manual trigger for pre-merge Windows build verification

env:
  RUST_TOOLCHAIN: '1.88.0'
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  # ORT inference runs through Apple CoreML.framework — no separate ORT library.
  # Intel Mac users: run arm64 binary via Rosetta 2 (transparent).
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Fall back to 0.0.0-dev for workflow_dispatch (branch name, not a tag).
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]'; then VERSION="0.0.0-dev"; fi
          sed -i.bak "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-macos-arm64-v4

      - name: Install LibRaw build dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          cp "target/${TARGET}/release/photohelper" "${DIR}/"
          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-macos.md "${DIR}/README-install.md"

          tar czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Archive size: $(du -sh ${DIR}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: macos-arm64
          path: photohelper-*.tar.gz*

  # ── Linux x86_64-gnu ───────────────────────────────────────────────────────
  # ort-sys statically links libonnxruntime.a — binary is self-contained.
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]'; then VERSION="0.0.0-dev"; fi
          sed -i "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config autoconf libtool \
            libimage-exiftool-perl

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-linux-x86_64-v4

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          cp "target/${TARGET}/release/photohelper" "${DIR}/"
          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-linux.md "${DIR}/README-install.md"

          tar czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Archive size: $(du -sh ${DIR}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: linux-x86_64
          path: photohelper-*.tar.gz*

  # ── Windows x86_64 (MSVC) ──────────────────────────────────────────────────
  # ORT is statically linked via Pyke CDN prebuilt (ANL-004: static=onnxruntime).
  # No onnxruntime.dll needed. LibRaw via vcpkg x64-windows-static-md triplet.
  build-windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          # Fall back to 0.0.0-dev for workflow_dispatch (branch name, not a tag).
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0-dev" }
          (Get-Content Cargo.toml) -replace '^version = "0.0.0"', "version = `"$version`"" |
            Set-Content Cargo.toml
          # Add-Content writes UTF-8 NoBOM (correct for GITHUB_ENV) on PowerShell 7.
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-windows-x86_64-v1

      - name: Install LibRaw via vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set. Expected on GHA windows-latest runners. " +
                  "If the runner image changed, file a runner-images issue."
          }
          # x64-windows-static-md: static lib + DLL-linked CRT (UCRT ships with Win10+).
          # Matches the Rust vcpkg crate's default triplet for x86_64-pc-windows-msvc.
          vcpkg install libraw:x64-windows-static-md

      - name: Build release binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ${{ env.VCPKG_INSTALLATION_ROOT }} is empty in the env: context because it
          # is a runner pre-installed variable, not a workflow env: var. Read it directly
          # from the shell environment and forward it to the vcpkg crate via VCPKG_ROOT.
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Smoke test binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "target/${{ env.TARGET }}/release/photohelper.exe" --version

      - name: Bundle archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VERSION = $env:RELEASE_VERSION
          $TARGET = "${{ env.TARGET }}"
          $DIR = "photohelper-${VERSION}-${TARGET}"
          New-Item -ItemType Directory -Path "$DIR/models" -Force

          # Binary (ORT is statically linked — no onnxruntime.dll needed)
          Copy-Item "target/${TARGET}/release/photohelper.exe" "$DIR/"

          # Models — use Get-ChildItem for explicit count validation
          Copy-Item "crates/photohelper-ai/models/manifest.toml" "$DIR/models/"
          $onnxFiles = Get-ChildItem "crates/photohelper-ai/models/*.onnx"
          if ($onnxFiles.Count -eq 0) {
            throw "No .onnx model files found — verify ``lfs: true`` in checkout step"
          }
          $onnxFiles | Copy-Item -Destination "$DIR/models/"

          # Install README
          Copy-Item "scripts/README-install-windows.md" "$DIR/README-install.md"

          # Create zip (Windows convention; PowerShell Compress-Archive is built-in)
          Compress-Archive -Path "$DIR" -DestinationPath "${DIR}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "${DIR}.zip").Hash.ToLower()
          "${hash}  ${DIR}.zip" | Set-Content "${DIR}.zip.sha256"

      - name: Verify and log archive contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Assembly System.IO.Compression.FileSystem
          # Reconstruct deterministic path ($DIR is not in scope in a separate run: block).
          $VERSION = $env:RELEASE_VERSION
          $TARGET = "${{ env.TARGET }}"
          $zipPath = "photohelper-${VERSION}-${TARGET}.zip"
          if (-not (Test-Path $zipPath)) { throw "Expected archive not found: $zipPath" }
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          $entries = try {
            $zip.Entries | Select-Object -ExpandProperty FullName
          } finally {
            $zip.Dispose()
          }
          Write-Output "Archive contents:"
          $entries | ForEach-Object { Write-Output "  $_" }
          # Assert required files
          $required = @("photohelper.exe", "models/manifest.toml", "README-install.md")
          foreach ($f in $required) {
            $found = $entries | Where-Object { $_ -like "*/$f" -or $_ -eq $f }
            if (-not $found) { throw "Required file missing from archive: $f" }
          }
          $onnxCount = ($entries | Where-Object { $_ -like "*.onnx" }).Count
          if ($onnxCount -eq 0) { throw "No .onnx model files in archive" }
          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Output "Archive verified: ${onnxCount} ONNX model(s), ${sizeMB}MB total"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: windows-x86_64
          path: photohelper-*.zip*

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release (draft)
    needs: [build-macos-arm64, build-linux-x86_64, build-windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317  # HEAD
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@3efcac8951299998593f871640ea8059d6818655  # HEAD
        with:
          files: dist/**
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
