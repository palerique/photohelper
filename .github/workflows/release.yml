# photohelper — Release pipeline.
#
# Triggered by a `v*.*.*` git tag (e.g. `git tag v0.1.0 && git push --tags`).
# Builds release archives for macOS arm64, macOS x86_64, and Linux x86_64-gnu.
# Windows x86_64 is deferred to v0.2 (TD-029: LibRaw autoconf / MSVC complexity).
#
# Each archive contains:
#   photohelper              — binary (rpath-patched to find the ORT library)
#   libonnxruntime.{dylib,so} — ONNX Runtime shared library (~60 MB)
#   models/                  — NIMA (12 MB) + CLIP (85 MB) ONNX models
#   README-install.md        — platform-specific install instructions
#
# Action versions pinned to commit SHAs (TD-001 policy):
#   actions/checkout          v4.3.1   34e114876b0b11c390a56381ad16ebd13914f8d5
#   dtolnay/rust-toolchain    HEAD     3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
#   Swatinem/rust-cache       v2.9.1   c19371144df3bb44fab255c43d04cbc2ab54d1c4
#   actions/upload-artifact   HEAD     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact HEAD     484a0b528fb4d7bd804637ccb632e47a0e638317
#   softprops/action-gh-release HEAD   3efcac8951299998593f871640ea8059d6818655

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  RUST_TOOLCHAIN: '1.88.0'
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-macos-arm64

      - name: Install LibRaw build dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          # Binary
          cp "target/${TARGET}/release/photohelper" "${DIR}/"

          # ORT shared library — search the Cargo build output
          ORT_LIB=""
          for pattern in \
              "target/${TARGET}/release/build/ort-*/out/onnxruntime/lib/libonnxruntime.dylib" \
              "target/release/build/ort-*/out/onnxruntime/lib/libonnxruntime.dylib" \
              "target/${TARGET}/release/build/ort-sys-*/out/onnxruntime/lib/libonnxruntime.dylib"; do
              ORT_LIB=$(find . -path "${pattern}" | head -1 2>/dev/null || true)
              [[ -n "${ORT_LIB}" ]] && break
          done
          if [[ -z "${ORT_LIB}" ]]; then
              echo "ERROR: libonnxruntime.dylib not found in build output" >&2
              find target -name 'libonnxruntime*' 2>/dev/null | head -20
              exit 1
          fi
          echo "Found ORT library: ${ORT_LIB}"
          cp "${ORT_LIB}" "${DIR}/"

          # Patch binary rpath so it finds libonnxruntime.dylib in the same directory
          install_name_tool -add_rpath @loader_path "${DIR}/photohelper"

          # Models (Git LFS)
          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"

          # Install guide
          cp scripts/README-install-macos.md "${DIR}/README-install.md"

          # Archive + checksum
          tar czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Archive: $(du -sh ${DIR}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: macos-arm64
          path: photohelper-*.tar.gz*

  # ── macOS x86_64 (Intel) ───────────────────────────────────────────────────
  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-13  # last Intel macOS runner on GHA
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-macos-x86_64

      - name: Install LibRaw build dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          cp "target/${TARGET}/release/photohelper" "${DIR}/"

          ORT_LIB=""
          for pattern in \
              "target/${TARGET}/release/build/ort-*/out/onnxruntime/lib/libonnxruntime.dylib" \
              "target/release/build/ort-*/out/onnxruntime/lib/libonnxruntime.dylib" \
              "target/${TARGET}/release/build/ort-sys-*/out/onnxruntime/lib/libonnxruntime.dylib"; do
              ORT_LIB=$(find . -path "${pattern}" | head -1 2>/dev/null || true)
              [[ -n "${ORT_LIB}" ]] && break
          done
          if [[ -z "${ORT_LIB}" ]]; then
              echo "ERROR: libonnxruntime.dylib not found" >&2
              find target -name 'libonnxruntime*' 2>/dev/null | head -20
              exit 1
          fi
          cp "${ORT_LIB}" "${DIR}/"
          install_name_tool -add_rpath @loader_path "${DIR}/photohelper"

          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-macos.md "${DIR}/README-install.md"

          tar czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: macos-x86_64
          path: photohelper-*.tar.gz*

  # ── Linux x86_64-gnu ───────────────────────────────────────────────────────
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          lfs: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" Cargo.toml
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config autoconf libtool \
            patchelf libimage-exiftool-perl

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 2026-05-29
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: release-linux-x86_64

      - name: Build release binary
        run: cargo build --release -p photohelper-cli --target ${{ env.TARGET }}

      - name: Bundle archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TARGET="${{ env.TARGET }}"
          DIR="photohelper-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/models"

          cp "target/${TARGET}/release/photohelper" "${DIR}/"

          # Find ORT shared library (.so)
          ORT_LIB=""
          for pattern in \
              "target/${TARGET}/release/build/ort-*/out/onnxruntime/lib/libonnxruntime.so" \
              "target/release/build/ort-*/out/onnxruntime/lib/libonnxruntime.so" \
              "target/${TARGET}/release/build/ort-sys-*/out/onnxruntime/lib/libonnxruntime.so"; do
              ORT_LIB=$(find . -path "${pattern}" | head -1 2>/dev/null || true)
              [[ -n "${ORT_LIB}" ]] && break
          done
          if [[ -z "${ORT_LIB}" ]]; then
              # Fallback: any libonnxruntime.so in build output
              ORT_LIB=$(find target -name 'libonnxruntime.so' | head -1 || true)
          fi
          if [[ -z "${ORT_LIB}" ]]; then
              echo "ERROR: libonnxruntime.so not found" >&2
              find target -name 'libonnxruntime*' 2>/dev/null | head -20
              exit 1
          fi
          echo "Found ORT library: ${ORT_LIB}"
          cp "${ORT_LIB}" "${DIR}/"

          # Also copy any versioned symlink targets
          ORT_DIR=$(dirname "${ORT_LIB}")
          find "${ORT_DIR}" -name 'libonnxruntime.so*' -exec cp -n {} "${DIR}/" \; || true

          # Patch rpath so binary finds libonnxruntime.so in $ORIGIN (same dir)
          patchelf --set-rpath '$ORIGIN' "${DIR}/photohelper"

          cp crates/photohelper-ai/models/manifest.toml "${DIR}/models/"
          cp crates/photohelper-ai/models/*.onnx        "${DIR}/models/"
          cp scripts/README-install-linux.md "${DIR}/README-install.md"

          tar czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Archive: $(du -sh ${DIR}.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # HEAD
        with:
          name: linux-x86_64
          path: photohelper-*.tar.gz*

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release (draft)
    needs: [build-macos-arm64, build-macos-x86_64, build-linux-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317  # HEAD
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@3efcac8951299998593f871640ea8059d6818655  # HEAD
        with:
          files: dist/**
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
