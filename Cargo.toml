[workspace]
resolver = "3"
members = [
    "crates/photohelper-cli",
    "crates/photohelper-core",
    "crates/photohelper-raw",
    "crates/photohelper-ai",
    "crates/photohelper-sidecar",
    "crates/photohelper-export",
    "crates/photohelper-cameras",
    "crates/photohelper-catalog",
    "crates/photohelper-test-helpers",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/palerique/photohelper"
authors = ["Paulo Henrique Lerbach Rodrigues <palerique@gmail.com>"]

[workspace.dependencies]
# CLI / observability
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
# indicatif dropped at R1.T8: the heartbeat thread (eprintln! every 10s,
# always-on via direct stderr) provides the liveness signal the spinner
# was supposed to give. A spinner would also compete with the heartbeat
# for the terminal line. Plan v5 promised a spinner; HANDOFF Checkpoint 1
# records this as a deliberate scope tightening.
# indicatif = "0.18"
num_cpus = "1"

# Error / domain
thiserror = "2"

# Filesystem walk + parallelism
walkdir = "2"
rayon = "1"

# Hashing + encoding
blake3 = "1"
base64 = "0.22"

# EXIF reading: LibRaw via `photohelper-raw::exif::read_cr3` is the v0.1
# sole producer (closes DN-006/DN-011: kamadak-exif failed on 370/370
# real Canon R8 CR3s). The kamadak-exif crate is no longer a workspace
# dep; the `unused_crate_dependencies` lint below catches any
# accidental re-introduction.

# Time
time = { version = "0.3.47", features = ["macros", "formatting", "parsing"] }

# Persistence — `rusqlite 0.34` (was 0.32 through session 01 → TD-002).
# Bumped voluntarily ahead of TD-002's 2026-08-01 calendar trigger
# because session 02 is already in catalog-touching territory and the
# bundled SQLite version under 0.32 was ~14 months stale. API surface
# verified for our call sites (open / execute / query_row /
# Transaction::Immediate / params!).
#
# v0.40 attempted (the plan's original target) but its bundled
# `libsqlite3-sys 0.38.x` uses `cfg_select!` which requires MSRV 1.92
# (we're on 1.88 per `rust-toolchain.toml`). Falling back to 0.34
# (last MSRV-1.88-compatible release on the recent line). TD-002
# remains open with a revised target: bump to latest rusqlite on the
# next MSRV bump.
rusqlite = { version = "0.34", features = ["bundled"] }
fs4 = { version = "1", features = ["sync"] }

# Build-script crypto (used by photohelper-raw's build.rs to verify the
# vendored LibRaw tarball's SHA-256 — Acceptance criterion 7).
sha2 = "0.10"
# C/C++ compiler driver used by photohelper-raw's build.rs to compile
# `cpp/photohelper_libraw_shim.c` (the minimal C-ABI wrapper that exposes
# stable typed-pointer + numeric-return accessors over LibRaw's larger
# struct types — avoids fragile #[repr(C)] mirroring of libraw_iparams_t /
# libraw_image_sizes_t / libraw_imgother_t in Rust).
cc = "1"

# Dev-deps used across crates
assert_cmd = "2"
predicates = "3"
tempfile = "3"
static_assertions = "1"
trybuild = "1"
filetime = "0.2"

# XML parsing for XMP sidecar I/O (photohelper-sidecar, session 06 D3).
quick-xml = { version = "0.36", features = ["serialize"] }

# AI inference (ONNX Runtime via ort, Apache-2.0)
# Exact RC pin per TD-014 (upgrade when ort 2.0.0 stable releases).
# default-features = false: disables bundled ONNX Runtime download; we use
# ort's default CPU execution provider.
# features: "std" required for non-no_std targets; "ndarray" enables array I/O.
# TD-014: ort RC pin =2.0.0-rc.12; upgrade to stable 2.0.0 when released.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native"] }

# Release profile tuned for batch image processing: thin LTO keeps build times
# manageable while giving most of the speedup of fat LTO; codegen-units = 1
# unlocks further cross-crate inlining.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Faster developer-loop builds without disabling debug info.
[profile.dev]
opt-level = 0
debug = "limited"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
# Catch any new workspace.dependencies entry that's declared but not
# actually consumed by the crate — guards against re-introducing
# kamadak-exif (per plan §4a R2-T8 atomic-commit shape).
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
# Defense-in-depth for `photohelper-raw`'s FFI module: every `unsafe`
# block must carry a `// SAFETY:` comment justifying why the contract is
# upheld. Workspace-level so the moment any new crate ever opts in to
# `unsafe_code = allow`, the SAFETY-comment requirement comes for free.
undocumented_unsafe_blocks = "deny"
# Pedantic-class style preferences relaxed at workspace level — the
# meaningful production-correctness gates above (unwrap/expect/panic/
# indexing) are what `CLAUDE.md § Rust-specific gates` actually requires.
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
redundant_closure_for_method_calls = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
